<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genera</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1 class="logo">Genera</h1>
      <span id="sync-status" class="status-pill status-gray">Local mode (not backed up)</span>
    </div>
    <nav class="tab-bar" aria-label="Main Navigation">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="review">Review</button>
      <button class="tab-btn" data-tab="cards">Cards</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </nav>
  </header>

  <main class="app-main">
    <section id="tab-dashboard" class="tab-panel active">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Due Today</span>
          <span class="stat-value due-count">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">New Left</span>
          <span class="stat-value new-count">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Total Cards</span>
          <span class="stat-value total-count">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Unseen</span>
          <span class="stat-value unseen-count">0</span>
        </div>
      </div>

      <div class="box-distribution">
        <div class="box-item"><span>Box 1</span><strong>0</strong></div>
        <div class="box-item"><span>Box 2</span><strong>0</strong></div>
        <div class="box-item"><span>Box 3</span><strong>0</strong></div>
        <div class="box-item"><span>Box 4</span><strong>0</strong></div>
        <div class="box-item"><span>Box 5</span><strong>0</strong></div>
      </div>
    </section>

    <section id="tab-review" class="tab-panel" hidden>
      <div class="empty-state">
        <p>No review in progress.</p>
      </div>
    </section>

    <section id="tab-cards" class="tab-panel" hidden>
      <div class="cards-header">
        <button id="btn-add-card" class="btn btn-primary">+ Add Card</button>
      </div>
      <div id="cards-container"></div>
    </section>

    <section id="tab-settings" class="tab-panel" hidden>
      <div class="empty-state">
        <p>Settings will appear here.</p>
      </div>
    </section>
  </main>

  <dialog id="card-modal" class="modal">
    <form id="card-form" method="dialog">
      <h3 id="modal-title">Add Card</h3>
      <input type="hidden" id="card-edit-id">
      <div class="form-group">
        <label for="card-question-input">Question</label>
        <textarea id="card-question-input" rows="3" required maxlength="500"></textarea>
      </div>
      <div class="form-group">
        <label for="card-answer-input">Answer</label>
        <textarea id="card-answer-input" rows="3" required maxlength="500"></textarea>
      </div>
      <div class="form-group">
        <label for="card-category-input">Category</label>
        <input type="text" id="card-category-input" maxlength="50" placeholder="e.g. Science">
      </div>
      <div class="modal-actions">
        <button type="button" id="modal-cancel-btn" class="btn">Cancel</button>
        <button type="submit" id="modal-save-btn" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
